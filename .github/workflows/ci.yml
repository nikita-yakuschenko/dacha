name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
      # azure.archive.ubuntu.com с раннера не резолвится. Те же пакеты Ubuntu берём с зеркала Яндекса.
      - run: |
          mapfile -t lists < <(grep -l azure.archive.ubuntu.com /etc/apt/sources.list /etc/apt/sources.list.d/* 2>/dev/null || true)
          test "${#lists[@]}" -gt 0
          sudo sed -i 's/azure\.archive\.ubuntu\.com/mirror.yandex.ru/g' "${lists[@]}"
          sudo apt-get update
      - run: npx playwright install --with-deps chromium
      - run: mkdir -p .impeccable/review
      - run: npm run test:ui
