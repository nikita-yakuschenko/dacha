name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
      # Браузер с CDN Playwright. --with-deps качает шрифты с azure.archive.ubuntu.com, это зеркало отваливается.
      - run: npx playwright install chromium
      - run: mkdir -p .impeccable/review
      - run: npm run test:ui
