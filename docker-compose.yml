services:
  web:
    image: prosto-dacha:local
    build:
      context: .
      args:
        NEXT_PUBLIC_LEAD_ENDPOINT: ${NEXT_PUBLIC_LEAD_ENDPOINT:-}
        NEXT_PUBLIC_PRIVACY_URL: ${NEXT_PUBLIC_PRIVACY_URL:-}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-}
    ports:
      - "${PORT:-3000}:3000"
    restart: unless-stopped
    init: true
